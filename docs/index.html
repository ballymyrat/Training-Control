<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Training Control</title><style>
:root{font-family:system-ui,Arial;color:#173a32;background:#eef3ef}*{box-sizing:border-box}body{margin:0}.top{background:linear-gradient(145deg,#04543e,#0a8062);color:white;padding:24px 20px 26px;border-radius:0 0 25px 25px}.top small{color:#e4c87e;letter-spacing:2px}.top h2{margin:9px 0 4px}.top p{margin:0;opacity:.85;font-size:12px}.wrap{padding:16px;max-width:750px;margin:auto}.nav{display:flex;gap:6px;overflow:auto;margin:-30px 0 16px;padding:7px;background:white;border-radius:15px;box-shadow:0 6px 20px #002a1a22;position:relative}.nav button{white-space:nowrap;font-size:12px;flex:1}.card{background:white;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 12px #0a30200b}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:#678279;font-size:12px}.big{font-size:25px;font-weight:750}.gold{color:#ad8227}button{border:0;border-radius:10px;padding:12px 13px;background:#e7f1eb;color:#095941;font-weight:700}button.active,.primary{background:#08765a;color:white}input,select{width:100%;border:1px solid #d4e2da;border-radius:9px;padding:12px;background:white;color:#173a32;font-size:15px;margin:5px 0 11px}label{font-size:12px;font-weight:650;color:#577367}.chip{border-radius:9px;padding:5px 8px;font-size:11px;font-weight:800}.good{background:#d5f3e3;color:#126c45}.bright{background:#ffea00;color:#3c3300}.yellow{background:#ffc247;color:#473100}.red{background:#e53a43;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid .card{margin:0}.foot{text-align:center;padding:22px;color:#658378;font-size:11px}h3{margin:10px 0}hr{border:0;border-top:1px solid #e4ede8;margin:14px 0}.hidden{display:none}.line{border-bottom:1px solid #e8eeea;padding:12px 0}.line:last-child{border:0}
</style></head><body><header class="top"><small>✦ TURKMENISTAN AIRLINES ✦</small><h2>TRAINING CONTROL</h2><p>CREW TRAINING · FLIGHT HOURS · QUALIFICATIONS</p></header><main class="wrap"><nav class="nav" id="nav"></nav><div id="app"></div><div class="foot">Created by Ballymyrat Yagdyyev<br>OFFLINE DEMONSTRATION · Fictional records only</div></main><script>
const C=[{id:1,n:'Пилот 001',role:'КВС / Инструктор',type:'B737NG',fo:1840,pic:4250,ins:620,q:['B737NG Captain','TRI','CAT II','RVSM','PBN / RNP']},{id:2,n:'Пилот 002',role:'Второй пилот',type:'B737NG',fo:1350,pic:0,ins:0,q:['B737NG First Officer','RVSM','PBN / RNP']},{id:3,n:'Пилот 003',role:'КВС',type:'B777',fo:3020,pic:5400,ins:0,q:['B777 Captain','CAT II/III','RVSM','PBN / RNP']},{id:4,n:'Пилот 004',role:'КВС / Инструктор',type:'A330',fo:2170,pic:3780,ins:840,q:['A330 Captain','TRI','RVSM']}];
const T=[['ffs','FFS Recurrent / Check',6],['theory','Normal / Emergency Procedures',6],['systems','Aircraft Systems',12],['windshear','Windshear',12],['egpws','EGPWS',12],['tcas','TCAS',12],['lvo','CAT II/III / LVO',12],['loft','LOFT',12],['crm','CRM Theory',36],['crmcheck','CRM Assessment',12],['upset','Upset Recovery',36],['nonemergency','Non-emergency Failures',36],['line','Line Check',12],['equipment','Emergency Equipment / Land',12],['water','Water Evacuation',24],['rightseat','Captain from FO Seat',12]];
let S;try{S=JSON.parse(localStorage.getItem('training-control-v1'))}catch(e){};if(!S)S={flights:[{id:1,p:1,no:'T5-101',route:'ASB–IST',date:'2026-10-21',minutes:255,role:'pic',approved:true}],training:[{p:1,k:'ffs',date:'2026-05-12'},{p:1,k:'crm',date:'2025-10-20'},{p:2,k:'ffs',date:'2026-04-29'}]};
let page='home',person=1,as='admin';const $=id=>document.getElementById(id),save=()=>localStorage.setItem('training-control-v1',JSON.stringify(S)),date=()=>new Date().toISOString().slice(0,10),fmt=s=>s.split('-').reverse().join('.'),month=(s,n)=>{let a=s.split('-').map(Number),d=new Date(Date.UTC(a[0],a[1]-1+n,1)),last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();d.setUTCDate(Math.min(a[2],last));return d.toISOString().slice(0,10)},days=s=>Math.ceil((new Date(s+'T00:00:00')-new Date(new Date().toDateString()))/86400000),chip=d=>d<=5?'red':d<=15?'yellow':d<=30?'bright':'good',h=m=>Math.floor(m/60)+':'+String(m%60).padStart(2,'0'),fl=p=>S.flights.filter(f=>f.p==p&&f.approved),sum=(p,r)=>fl(p).filter(f=>f.role===r).reduce((a,f)=>a+f.minutes,0),safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),sel=()=>C.find(c=>c.id==person),btn=(txt,fn)=>'<button onclick="'+fn+'">'+txt+'</button>';
function render(){let tabs=[['home','Главная'],['crew','Сотрудники'],['training','Сроки'],['flights','Полёты'],['review','Проверка']];$('nav').innerHTML=tabs.map(t=>'<button class="'+(page===t[0]?'active':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>').join('');let out='';
if(page==='home'){const pending=S.flights.filter(f=>!f.approved).length;out='<h3>Панель управления</h3><div class="grid"><div class="card"><div class="muted">Сотрудники</div><div class="big">'+C.length+'</div></div><div class="card"><div class="muted">Новые полёты</div><div class="big">'+pending+'</div></div><div class="card"><div class="muted">Режим</div><div style="font-weight:750">'+(as==='admin'?'Администратор':'Пилот')+'</div></div><div class="card"><div class="muted">Контроль</div><div style="font-weight:750">Глава 27</div></div></div><div class="card"><label>Демонстрационный режим доступа</label><select id="role" onchange="as=this.value;render()"><option value="admin" '+(as==='admin'?'selected':'')+'>Администратор</option><option value="pilot" '+(as==='pilot'?'selected':'')+'>Пилот (просмотр своей карточки)</option></select><p class="muted">Это переключатель интерфейса, не настоящая авторизация.</p></div><div class="card"><h3>Ближайшие сроки</h3>'+S.training.map(r=>{let t=T.find(t=>t[0]===r.k),d=month(r.date,t[2]),left=days(d);return {r,t,d,left}}).sort((a,b)=>a.left-b.left).slice(0,5).map(x=>'<div class="line row"><div><b>'+safe(C.find(c=>c.id===x.r.p).n)+'</b><div class="muted">'+safe(x.t[1])+' · '+fmt(x.d)+'</div></div><span class="chip '+chip(x.left)+'">'+(x.left<0?'Просрочено '+(-x.left):x.left+' дн.')+'</span></div>').join('')+'</div>'}
if(page==='crew'){out='<h3>Личные карточки</h3>'+(as==='admin'?C.map(c=>'<div class="card row" onclick="person='+c.id+';render()" style="border:'+(person===c.id?'2px solid #07815e':'0')+'"><div><b>'+c.n+'</b><div class="muted">'+c.role+' · '+c.type+'</div></div><b>›</b></div>').join(''):'')+'<div class="card"><h3>'+sel().n+'</h3><p class="muted">'+sel().role+' · '+sel().type+'</p><div class="grid">'+[['Вторым пилотом',sel().fo*60+sum(person,'fo')],['Командиром',sel().pic*60+sum(person,'pic')],['Инструкторские часы (отдельно)',sel().ins*60+sum(person,'ins')],['Общий налёт (без двойного учёта)',(sel().fo+sel().pic)*60+sum(person,'fo')+sum(person,'pic')+sum(person,'ins')]].map(v=>'<div class="card" style="background:#f1f7f2"><div class="muted">'+v[0]+'</div><div class="big">'+h(v[1])+'</div></div>').join('')+'</div><hr><h3>Допуски</h3>'+sel().q.map(q=>'<div class="line">✓ '+q+'</div>').join('')+'<p class="muted">Даты и документы допусков добавим в рабочую систему.</p></div>'}
if(page==='training'){out='<h3>Сроки подготовки · Глава 27</h3><div class="card">'+(as==='admin'?'<label>Сотрудник</label><select id="tp">'+C.map(c=>'<option value="'+c.id+'" '+(c.id===person?'selected':'')+'>'+c.n+' · '+c.type+'</option>').join('')+'</select>':'<p>'+sel().n+'</p>')+'<label>Вид подготовки</label><select id="tk" onchange="preview()">'+T.map(t=>'<option value="'+t[0]+'">'+t[1]+' · '+t[2]+' мес.</option>').join('')+'</select><label>Дата прохождения</label><input id="td" type="date" value="'+date()+'" onchange="preview()"><div id="preview" class="card" style="background:#f1f7f2"></div>'+(as==='admin'?'<button class="primary" onclick="addTraining()">Сохранить прохождение</button>':'<p class="muted">Редактирование только для администратора.</p>')+'</div><h3>Внесённые сроки</h3>'+S.training.filter(r=>as==='admin'||r.p===person).map(r=>{let t=T.find(t=>t[0]===r.k),d=month(r.date,t[2]),left=days(d);return '<div class="card row"><div><b>'+safe(C.find(c=>c.id===r.p).n)+'</b><div class="muted">'+safe(t[1])+'</div><div class="muted">Пройдено: '+fmt(r.date)+'<br>Следующий срок: '+fmt(d)+'</div></div><span class="chip '+chip(left)+'">'+(left<0?'Просрочено':left+' дн.')+'</span></div>'}).join('');}
if(page==='flights'){out='<h3>Электронная лётная книжка</h3><div class="card">'+(as==='admin'?'<label>Сотрудник</label><select id="fp">'+C.map(c=>'<option value="'+c.id+'" '+(c.id===person?'selected':'')+'>'+c.n+'</option>').join('')+'</select>':'<p>'+sel().n+'</p>')+'<label>Дата рейса</label><input id="fd" type="date" value="'+date()+'"><label>Номер рейса</label><input id="fn" placeholder="T5-105"><label>Маршрут</label><input id="fr" placeholder="ASB–FRA"><label>Роль</label><select id="fro"><option value="fo">Второй пилот</option><option value="pic">Командир</option><option value="ins">Инструктор (демо)</option></select><div class="grid"><div><label>Часы</label><input id="fh" type="number" min="0" value="2"></div><div><label>Минуты</label><input id="fm" type="number" min="0" max="59" value="0"></div></div><button class="primary" onclick="addFlight()">Отправить на проверку</button></div><h3>Журнал</h3>'+S.flights.filter(f=>as==='admin'||f.p===person).slice().reverse().map(f=>'<div class="card row"><div><b>'+safe(f.no)+' · '+safe(f.route)+'</b><div class="muted">'+fmt(f.date)+' · '+C.find(c=>c.id===f.p).n+' · '+f.role.toUpperCase()+'</div></div><div><b>'+h(f.minutes)+'</b><div class="chip '+(f.approved?'good':'yellow')+'">'+(f.approved?'Принято':'Ожидает')+'</div></div></div>').join('');}
if(page==='review'){out='<h3>Проверка полётов</h3>'+S.flights.filter(f=>!f.approved&&(as==='admin'||f.p===person)).map(f=>'<div class="card"><b>'+safe(C.find(c=>c.id===f.p).n)+'</b><p>'+safe(f.no)+' · '+safe(f.route)+' · '+fmt(f.date)+' · '+h(f.minutes)+'</p>'+(as==='admin'?'<button class="primary" onclick="approve('+f.id+')">Подтвердить</button> <button onclick="reject('+f.id+')">Отклонить</button>':'<span class="chip yellow">Ожидает проверки</span>')+'</div>').join('');if(!S.flights.some(f=>!f.approved&&(as==='admin'||f.p===person)))out+='<div class="card">Нет записей на проверке.</div>';}
$('app').innerHTML=out;if(page==='training')preview()}
function go(p){page=p;render()}function preview(){let t=T.find(t=>t[0]==$('tk').value),d=month($('td').value,t[2]),left=days(d);$('preview').innerHTML='<div class="muted">Следующая дата</div><div class="big">'+fmt(d)+'</div><span class="chip '+chip(left)+'">'+(left<0?'Просрочено '+(-left)+' дн.':'Осталось '+left+' дн.')+'</span>'}
function addTraining(){S.training=S.training.filter(r=>!(r.p==$('tp').value&&r.k==$('tk').value));S.training.push({p:Number($('tp').value),k:$('tk').value,date:$('td').value});save();render()}
function addFlight(){let no=$('fn').value.trim(),route=$('fr').value.trim(),hh=Number($('fh').value),mm=Number($('fm').value);if(!no||!route||!Number.isInteger(hh)||!Number.isInteger(mm)||hh<0||mm<0||mm>59||hh*60+mm===0){alert('Заполни рейс и корректное время.');return}S.flights.push({id:Date.now(),p:as==='admin'?Number($('fp').value):person,no,route,date:$('fd').value,minutes:hh*60+mm,role:$('fro').value,approved:false});save();page='review';render()}
function approve(id){S.flights.find(f=>f.id===id).approved=true;save();render()}function reject(id){S.flights=S.flights.filter(f=>f.id!==id);save();render()}render();
</script></body></html>
