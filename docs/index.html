kground:#fff;margin:5px 0}textarea{min-height:72px}.chip{display:inline-block;border-radius:10px;padding:6px 9px;font-size:11px;font-weight:800}.ok{background:#d9f3e5;color:#12633e}.pending{background:#fff1b4;color:#765200}.bright{background:#ffea00;color:#453700}.yellow{background:#ffbd45;color:#573500}.red{background:#e53e48;color:white}.line{padding:12px 0;border-bottom:1px solid #e7eee9}.line:last-child{border:0}.sub{font-size:13px;color:#577368}.footer{text-align:center;padding:28px 8px;color:#789087;font-size:12px}.full{width:100%}.small{font-size:12px}.badge{color:#a98235;font-weight:800;letter-spacing:2px}.notice{border-left:4px solid #cba554;padding:12px;background:#fff9e8;border-radius:9px;font-size:12px}.section{margin-top:18px}.hide{display:none}@media(max-width:390px){.metric{font-size:20px}.grid3{grid-template-columns:1fr 1fr}header h1{font-size:23px}}

const $=id=>document.getElementById(id),save=()=>localStorage.setItem(key,JSON.stringify(db)),esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>new Date().toLocaleDateString('en-CA'),fdate=s=>s?String(s).split('-').reverse().join('.'):'—',hm=m=>{m=Math.round(m||0);return Math.floor(m/60)+':'+String(m%60).padStart(2,'0')},mins=s=>{if(!/^\d{2}:\d{2}$/.test(s||''))return NaN;let a=s.split(':').map(Number);return a[0]<24&&a[1]<60?a[0]*60+a[1]:NaN},diff=(a,b)=>((b-a+1440)%1440),dayDiff=s=>Math.ceil((new Date(s+'T00:00:00')-new Date(new Date().toDateString()))/86400000),chip=d=>d<=5?'red':d<=15?'yellow':d<=30?'bright':'ok',getCrew=id=>crew.find(c=>c.id===Number(id)),course=k=>courses.find(c=>c[0]===k)||[k,k,12],month=(s,n)=>{let a=s.split('-').map(Number),d=new Date(Date.UTC(a[0],a[1]-1+n,1));d.setUTCDate(Math.min(a[2],new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate()));return d.toISOString().slice(0,10)};

function duration(s){let a=String(s).split(':').map(Number);return a.length===2&&a.every(Number.isInteger)&&a[0]>=0&&a[1]>=0&&a[1]<60?a[0]*60+a[1]:NaN}
function previewFlight(){let ids=['off','take','land','on','medical','scope','brief','nightBlock','nightFlight'];if(!ids.every(id=>$(id)))return;let f=Object.fromEntries(ids.map(id=>[id,$(id).value]));f.nightBlock=duration(f.nightBlock);f.nightFlight=duration(f.nightFlight);let z=flightCalc(f);$('flightPreview').innerHTML=z?'<div class="grid3"><div><div class="muted">BLOCK TIME</div><div class="metric">'+hm(z.block)+'</div></div><div><div class="muted">FLIGHT TIME</div><div class="metric">'+hm(z.air)+'</div></div><div><div class="muted">DUTY TIME</div><div class="metric">'+hm(z.duty)+'</div></div></div><p class="sub">Дебрифинг: '+z.brief+' мин · BLOCK NIGHT: '+hm(z.nightBlock)+' · FLIGHT NIGHT: '+hm(z.nightFlight)+'</p>':'<span class="red chip">Проверь времена UTC, BLOCK NIGHT и FLIGHT NIGHT</span>'}
function addFlight(){let ids=['fd','fn','fr','ft','fro','off','take','land','on','medical','scope','brief','nightBlock','nightFlight','landings','nightLandings','instructor'],v=Object.fromEntries(ids.map(id=>[id,$(id).value]));let f={id:Date.now(),p:access==='pilot'?who:Number($('fp').value),date:v.fd,no:v.fn.trim(),route:v.fr.trim(),type:v.ft,role:v.fro,off:v.off,take:v.take,land:v.land,on:v.on,medical:v.medical,scope:v.scope,brief:Number(v.brief),nightBlock:duration(v.nightBlock),nightFlight:duration(v.nightFlight),landings:Number(v.landings),nightLandings:Number(v.nightLandings),instructor:v.instructor==='yes',status:'pending'};let z=flightCalc(f);if(!f.date||!f.no||!f.route||!z||!Number.isInteger(f.landings)||f.landings<0||!Number.isInteger(f.nightLandings)||f.nightLandings<0||f.nightLandings>f.landings){alert('Проверь номер, маршрут, UTC-время и количество посадок.');return}db.flights.push(f);save();alert('Рейс сохранён. Block Time '+hm(z.block)+' добавлен к предварительному налёту и ожидает проверки.');go('crew')}
function review(id,status){let f=db.flights.find(x=>x.id===id);if(f){f.status=status;save();render()}}
function addTraining(){let p=Number($('tp').value),kind=$('tk').value,done=$('td').value;if(!done)return;db.trainings.push({id:Date.now(),p,kind,done,due:month(done,course(kind)[2])});save();render()}
function addTask(){let date=$('taskdate').value;if(!date)return;db.tasks.push({id:Date.now(),p:Number($('taskp').value),kind:$('taskkind').value,date,note:$('tasknote').value});save();render()}
function addFeedback(){let text=$('fbtext').value.trim();if(!text)return alert('Напиши замечание.');db.feedback.push({id:Date.now(),p:Number($('fbp').value),date:$('fbdate').value,text});save();render()}
render();
</script></body></html>
